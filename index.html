<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finavex — Administration des publications</title>
<style>
  :root{
    --bg:#08080d; --panel:#0f0f18; --panel2:#14141f; --line:#22222f;
    --acid:#c8ff3f; --text:#f2f2f5; --sub:#8a8a99; --danger:#ff4d4d; --pink:#ff3fae; --violet:#7b5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px 16px 80px;}
  .wrap{max-width:640px;margin:0 auto;}
  .brand{font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--acid),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px;}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:26px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
  .field input,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 13px;border-radius:12px;font-size:14px;outline:none;font-family:inherit;}
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .photo-row{display:flex;gap:10px;margin-bottom:14px;}
  .photo-slot{flex:1;aspect-ratio:1;background:var(--panel2);border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub);cursor:pointer;overflow:hidden;position:relative;}
  .photo-slot img{width:100%;height:100%;object-fit:cover;}
  .btn-main{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--acid),#7be032);color:#08080d;font-weight:800;font-size:14px;cursor:pointer;}
  .btn-main:disabled{opacity:.5;cursor:not-allowed;}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:8px 12px;border-radius:10px;font-size:12px;cursor:pointer;}
  .msg{font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;display:none;}
  .msg.ok{display:block;background:rgba(200,255,63,.1);border:1px solid var(--acid);color:var(--acid);}
  .msg.err{display:block;background:rgba(255,77,77,.1);border:1px solid var(--danger);color:#ff8080;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .item{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center;}
  .item img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--panel);flex-shrink:0;}
  .item .info{flex:1;min-width:0;}
  .item .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .d{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .item .actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
  .btn-edit{background:transparent;border:1px solid var(--acid-dim,var(--acid));color:var(--acid);padding:8px 12px;border-radius:10px;font-size:12px;cursor:pointer;}
  .lock-wrap{max-width:360px;margin:80px auto;text-align:center;}
  .lock-wrap input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;margin:16px 0;text-align:center;font-size:15px;}
  h2{font-size:15px;margin-bottom:14px;color:var(--acid);}
</style>
</head>
<body>

<div class="lock-wrap" id="lockWrap">
  <div class="brand">Finavex</div>
  <div class="sub">Espace administration — publications</div>
  <input type="password" id="adminPass" placeholder="Code d'accès admin">
  <button class="btn-main" id="unlockBtn">Entrer</button>
  <div class="msg err" id="lockErr">Code incorrect.</div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div class="brand">Finavex</div>
  <div class="sub">Publie un produit à investissement court terme. Il apparaîtra aussitôt dans le fil des utilisateurs.</div>

  <div class="card">
    <h2 id="formTitle">Nouvelle publication</h2>
    <div class="msg" id="formMsg"></div>

    <div class="photo-row">
      <div class="photo-slot" data-slot="0">＋</div>
      <div class="photo-slot" data-slot="1">＋</div>
      <div class="photo-slot" data-slot="2">＋</div>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">

    <div class="field"><label>Nom du produit</label><input type="text" id="fProduct" placeholder="Ex : Maïs — sac de 100kg"></div>
    <div class="field"><label>Description</label><textarea id="fCaption" maxlength="400" placeholder="Décris le produit, l'origine, le contexte de l'investissement…"></textarea></div>
    <div class="row2">
      <div class="field"><label>Mise à investir</label><input type="text" id="fPrice" placeholder="Ex : 10 000 FCFA"></div>
      <div class="field"><label>Bénéfice attendu</label><input type="text" id="fProfit" placeholder="Ex : 25 000 FCFA"></div>
    </div>
    <div class="field"><label>Échéance</label><input type="text" id="fDeadline" placeholder="Ex : Bénéfice à la fin du mois"></div>

    <button class="btn-main" id="publishBtn">Publier</button>
    <button class="btn-danger" id="cancelEditBtn" style="width:100%;margin-top:10px;display:none;">Annuler la modification</button>
  </div>

  <div class="card">
    <h2>Publications en ligne</h2>
    <div class="list" id="postsList"><div class="sub">Chargement…</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  /* ================= CONFIG (identique à l'app Finavex) ================= */
  const firebaseConfig = {
    apiKey: "AIzaSyDHRxGdHpM2RFtvGMhXOu3slrT2JlmyNLM",
    authDomain: "data-fae4a.firebaseapp.com",
    projectId: "data-fae4a",
    storageBucket: "data-fae4a.firebasestorage.app",
    messagingSenderId: "1077301559347",
    appId: "1:1077301559347:web:3405ab3bc8e1010d9e6346"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const FieldValue = firebase.firestore.FieldValue;

  const CLOUDINARY_CLOUD_NAME = "djxcqczh1";
  const CLOUDINARY_UPLOAD_PRESET = "database";

  /* ⚠️ Code d'accès très simple côté client — change-le et ne partage cette page
     qu'avec les personnes de confiance qui publient les produits. Pour une
     vraie sécurité il faudrait un compte admin côté Firebase (règles Firestore). */
  const ADMIN_CODE = "finavex2026";
  const ADMIN_UID = "finavex_admin";
  const ADMIN_CODENAME = "Finavex";

  document.getElementById('unlockBtn').onclick = ()=>{
    const val = document.getElementById('adminPass').value;
    if(val === ADMIN_CODE){
      document.getElementById('lockWrap').style.display='none';
      document.getElementById('appWrap').style.display='block';
      loadPosts();
    } else {
      document.getElementById('lockErr').style.display='block';
    }
  };
  document.getElementById('adminPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('unlockBtn').click(); });

  /* ---------- Compression + upload photo (repris de l'app principale) ---------- */
  function compressImage(file, maxW=1080, quality=0.72){
    return new Promise((resolve)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => resolve(blob || file), 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      reader.readAsDataURL(file);
    });
  }
  async function uploadToCloudinary(file){
    const blob = await compressImage(file);
    const form = new FormData();
    form.append('file', blob);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method:'POST', body: form });
    if(!res.ok) throw new Error('Échec upload photo');
    return res.json();
  }

  /* ---------- Slots photos ---------- */
  let slots = [null, null, null];
  document.querySelectorAll('.photo-slot').forEach(el=>{
    el.onclick = ()=>{ pickIdx = +el.dataset.slot; document.getElementById('photoInput').click(); };
  });
  let pickIdx = 0;
  document.getElementById('photoInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    slots[pickIdx] = { file };
    const el = document.querySelector(`.photo-slot[data-slot="${pickIdx}"]`);
    const reader = new FileReader();
    reader.onload = ev => { el.innerHTML = `<img src="${ev.target.result}">`; };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  function resetForm(){
    slots = [null, null, null];
    document.querySelectorAll('.photo-slot').forEach(el=>el.innerHTML='＋');
    document.getElementById('fProduct').value='';
    document.getElementById('fCaption').value='';
    document.getElementById('fPrice').value='';
    document.getElementById('fProfit').value='';
    document.getElementById('fDeadline').value='';
    editingId = null;
    document.getElementById('formTitle').textContent = 'Nouvelle publication';
    document.getElementById('publishBtn').textContent = 'Publier';
    document.getElementById('cancelEditBtn').style.display='none';
  }

  let editingId = null;

  document.getElementById('publishBtn').onclick = async ()=>{
    const btn = document.getElementById('publishBtn');
    const msg = document.getElementById('formMsg');
    msg.className='msg'; msg.style.display='none';
    const product = document.getElementById('fProduct').value.trim();
    const captionRaw = document.getElementById('fCaption').value.trim();
    const price = document.getElementById('fPrice').value.trim();
    const profit = document.getElementById('fProfit').value.trim();
    const deadline = document.getElementById('fDeadline').value.trim();
    const caption = product ? (product + (captionRaw ? ' — ' + captionRaw : '')) : captionRaw;
    const filledSlots = slots.filter(Boolean);

    if(!caption){ msg.textContent="Ajoute au moins un nom de produit ou une description."; msg.className='msg err'; return; }
    if(!editingId && filledSlots.length===0){ msg.textContent="Ajoute au moins une photo."; msg.className='msg err'; return; }

    btn.disabled = true; btn.textContent = editingId ? 'Enregistrement…' : 'Publication…';
    try{
      let photos = null;
      if(filledSlots.length){
        photos = [];
        for(const s of filledSlots){
          if(s.url) photos.push(s.url);
          else{ const up = await uploadToCloudinary(s.file); photos.push(up.secure_url || up.url); }
        }
      }
      const data = { caption, price, profit, deadline };
      if(photos) data.photos = photos;

      if(editingId){
        data.updatedAt = FieldValue.serverTimestamp();
        await db.collection('posts').doc(editingId).update(data);
        msg.textContent = "Publication mise à jour."; msg.className='msg ok';
      } else {
        await db.collection('posts').add({
          uid: ADMIN_UID,
          codeName: ADMIN_CODENAME,
          photoURL: '',
          photos, caption, price, profit, deadline,
          likesCount:0, likesUsers:[], commentsCount:0,
          createdAt: FieldValue.serverTimestamp()
        });
        msg.textContent = "Publication mise en ligne sur Finavex."; msg.className='msg ok';
      }
      resetForm();
      loadPosts();
    }catch(err){
      msg.textContent = "Erreur : " + err.message; msg.className='msg err';
    }finally{
      btn.disabled = false; btn.textContent = editingId ? 'Enregistrer' : 'Publier';
    }
  };

  /* ---------- Liste de TOUTES les publications (admin + éventuelles anciennes) ---------- */
  function loadPosts(){
    db.collection('posts').orderBy('createdAt','desc').limit(200)
      .onSnapshot(snap=>{
        const list = document.getElementById('postsList');
        if(snap.empty){ list.innerHTML = '<div class="sub">Aucune publication pour l\'instant.</div>'; return; }
        list.innerHTML = '';
        snap.forEach(doc=>{
          const p = doc.data();
          const row = document.createElement('div');
          row.className = 'item';
          row.innerHTML = `
            <img src="${(p.photos&&p.photos[0])||''}">
            <div class="info">
              <div class="t">${escapeHtml(p.caption||'(sans titre)')}</div>
              <div class="d">${p.price?('💰 '+escapeHtml(p.price)+' '):''}${p.profit?('· 📈 '+escapeHtml(p.profit)+' '):''}· ❤ ${p.likesCount||0} · 💬 ${p.commentsCount||0}</div>
            </div>
            <div class="actions">
              <button class="btn-edit" data-id="${doc.id}">Modifier</button>
              <button class="btn-danger" data-id="${doc.id}">Supprimer</button>
            </div>`;
          row.querySelector('.btn-edit').onclick = ()=> startEdit(doc.id, p);
          row.querySelector('.btn-danger').onclick = async ()=>{
            if(!confirm('Supprimer définitivement cette publication ?')) return;
            await db.collection('posts').doc(doc.id).delete();
          };
          list.appendChild(row);
        });
      }, err=>{
        document.getElementById('postsList').innerHTML = '<div class="sub">Erreur de chargement : '+escapeHtml(err.message)+'</div>';
      });
  }

  function startEdit(id, p){
    editingId = id;
    document.getElementById('formTitle').textContent = 'Modifier la publication';
    document.getElementById('publishBtn').textContent = 'Enregistrer';
    const caption = p.caption || '';
    const sepIdx = caption.indexOf(' — ');
    document.getElementById('fProduct').value = sepIdx>-1 ? caption.slice(0, sepIdx) : '';
    document.getElementById('fCaption').value = sepIdx>-1 ? caption.slice(sepIdx+3) : caption;
    document.getElementById('fPrice').value = p.price || '';
    document.getElementById('fProfit').value = p.profit || '';
    document.getElementById('fDeadline').value = p.deadline || '';
    slots = [null, null, null];
    document.querySelectorAll('.photo-slot').forEach((el,i)=>{
      const url = p.photos && p.photos[i];
      if(url){ slots[i] = { url }; el.innerHTML = `<img src="${url}">`; }
      else{ el.innerHTML = '＋'; }
    });
    document.getElementById('formMsg').style.display='none';
    document.getElementById('cancelEditBtn').style.display='block';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  document.getElementById('cancelEditBtn').onclick = ()=> resetForm();
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
