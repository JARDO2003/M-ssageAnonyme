<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRYPT — Messagerie</title>
<style>
:root{
  --bg:#08080d;
  --panel:#0f0f18;
  --panel2:#14141f;
  --line:#22222f;
  --acid:#c8ff3f;
  --acid-dim:#8fb82c;
  --violet:#7b5cff;
  --pink:#ff3fae;
  --text:#f2f2f5;
  --sub:#8a8a99;
  --danger:#ff4d4d;
  --bubble-me: linear-gradient(135deg,#7b5cff,#ff3fae);
  --bubble-them:#181826;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  height:100vh;
  overflow:hidden;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(123,92,255,0.12), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(255,63,174,0.10), transparent 40%);
}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:10px;}

/* ---------- LOADER ---------- */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
#loader .logo{font-size:38px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--acid),var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}
#loader .sub{color:var(--sub);font-size:12px;letter-spacing:3px;text-transform:uppercase;}

/* ---------- AUTH ---------- */
.auth-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 28px;position:relative;overflow:hidden;}
.auth-card::before{content:"";position:absolute;top:-60%;left:-20%;width:160%;height:160%;background:conic-gradient(from 0deg,var(--violet),var(--pink),var(--acid),var(--violet));opacity:.06;animation:spin 12s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-card > *{position:relative;z-index:1;}
.brand{font-size:30px;font-weight:900;letter-spacing:1px;margin-bottom:4px;background:linear-gradient(90deg,var(--acid),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-tag{color:var(--sub);font-size:12px;margin-bottom:26px;letter-spacing:1px;}
.tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--panel2);padding:5px;border-radius:14px;}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:var(--sub);font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.5px;transition:.2s;}
.tab-btn.active{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--sub);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:12px;font-size:14px;outline:none;transition:.2s;}
.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(123,92,255,.15);}
.photo-pick{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.photo-circle{width:64px;height:64px;border-radius:50%;background:var(--panel2);border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex-shrink:0;font-size:22px;color:var(--sub);}
.photo-circle img{width:100%;height:100%;object-fit:cover;}
.upload-label{font-size:12px;color:var(--sub);}
.upload-label b{color:var(--acid);cursor:pointer;}
.btn-main{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--acid),#7be032);color:#08080d;font-weight:800;font-size:14px;letter-spacing:.5px;cursor:pointer;margin-top:6px;transition:.15s;}
.btn-main:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-main:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.auth-error{background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.3);color:#ff8080;padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:none;}
.codename-reveal{background:var(--panel2);border:1px solid var(--acid-dim);border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;display:none;}
.codename-reveal .cn{font-size:22px;font-weight:900;color:var(--acid);letter-spacing:1px;margin-top:4px;}
.codename-reveal .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px;}

/* ---------- APP SHELL ---------- */
.app{position:fixed;inset:0;display:none;}
.shell{display:flex;height:100%;}
.sidebar{width:380px;min-width:300px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
.side-head{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--violet),var(--pink));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
.side-head .who{flex:1;min-width:0;}
.side-head .who .cn{font-weight:800;font-size:14.5px;color:var(--acid);}
.side-head .who .st{font-size:11px;color:var(--sub);}
.icon-btn{background:var(--panel2);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;color:var(--sub);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;}
.icon-btn:hover{color:var(--acid);border-color:var(--acid-dim);}
.search-wrap{padding:12px 16px;border-bottom:1px solid var(--line);}
.search-wrap input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:12px;font-size:13.5px;outline:none;}
.search-wrap input:focus{border-color:var(--violet);}
.search-results{max-height:220px;overflow-y:auto;border-bottom:1px solid var(--line);}
.result-row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:.15s;}
.result-row:hover{background:var(--panel2);}
.result-row .cn{font-weight:700;font-size:13.5px;color:var(--text);}
.result-row .add{margin-left:auto;font-size:11px;color:var(--acid);border:1px solid var(--acid-dim);padding:5px 10px;border-radius:8px;background:rgba(200,255,63,.06);}
.chat-list{flex:1;overflow-y:auto;}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.02);transition:.15s;position:relative;}
.chat-row:hover,.chat-row.active{background:var(--panel2);}
.chat-row .info{flex:1;min-width:0;}
.chat-row .top{display:flex;justify-content:space-between;align-items:center;}
.chat-row .cn{font-weight:700;font-size:14px;}
.chat-row .time{font-size:10.5px;color:var(--sub);}
.chat-row .preview{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
.dot-online{width:9px;height:9px;border-radius:50%;background:var(--acid);position:absolute;left:44px;bottom:11px;border:2px solid var(--panel);}
.unread{background:var(--pink);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:2px 7px;min-width:18px;text-align:center;}
.empty-list{padding:30px 20px;text-align:center;color:var(--sub);font-size:12.5px;}

.main{flex:1;display:flex;flex-direction:column;background:
  radial-gradient(circle at 30% 0%, rgba(123,92,255,.05), transparent 45%),
  radial-gradient(circle at 80% 100%, rgba(255,63,174,.05), transparent 45%),
  #0a0a11;}
.no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:10px;}
.no-chat .glyph{font-size:52px;filter:grayscale(1) opacity(.4);}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel);}
.chat-head .cn{font-weight:800;font-size:15px;color:var(--text);}
.chat-head .st{font-size:11.5px;color:var(--sub);}
.messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:4px;}
.msg-row{display:flex;max-width:70%;}
.msg-row.me{align-self:flex-end;justify-content:flex-end;}
.msg-row.them{align-self:flex-start;}
.bubble{padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word;}
.msg-row.me .bubble{background:var(--bubble-me);color:#fff;border-bottom-right-radius:4px;}
.msg-row.them .bubble{background:var(--bubble-them);color:var(--text);border-bottom-left-radius:4px;}
.bubble img,.bubble video{max-width:240px;border-radius:10px;display:block;margin-bottom:4px;}
.meta{font-size:9.5px;opacity:.65;margin-top:3px;text-align:right;display:flex;gap:4px;justify-content:flex-end;align-items:center;}
.typing-indicator{align-self:flex-start;padding:10px 14px;background:var(--bubble-them);border-radius:16px;border-bottom-left-radius:4px;display:none;gap:4px;}
.typing-indicator span{width:6px;height:6px;background:var(--sub);border-radius:50%;animation:bounce 1.2s infinite ease-in-out;}
.typing-indicator span:nth-child(2){animation-delay:.15s;}
.typing-indicator span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.composer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;background:var(--panel);}
.composer textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:16px;font-size:14px;font-family:inherit;max-height:100px;outline:none;}
.composer textarea:focus{border-color:var(--violet);}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--acid),#7be032);color:#08080d;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.send-btn:disabled{opacity:.4;}
.attach-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:18px;cursor:pointer;flex-shrink:0;}
.attach-btn:hover{color:var(--acid);}
#fileInput{display:none;}
.upload-progress{position:absolute;bottom:70px;left:20px;right:20px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11.5px;color:var(--sub);display:none;}

@media(max-width:760px){
  .sidebar{width:100%;position:absolute;inset:0;z-index:5;}
  .sidebar.hide{display:none;}
  .main{width:100%;}
  .main.hide{display:none;}
  .back-btn{display:flex!important;}
}
.back-btn{display:none;background:none;border:none;color:var(--acid);font-size:20px;cursor:pointer;margin-right:4px;}
</style>
</head>
<body>

<div id="loader"><div class="logo">KRYPT</div><div class="sub">Chiffrement en cours…</div></div>

<!-- ===================== AUTH ===================== -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-card">
    <div class="brand">KRYPT</div>
    <div class="brand-tag">Ton identité réelle ne quitte jamais ce cercle.</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">Connexion</button>
      <button class="tab-btn" id="tabRegister">Inscription</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- LOGIN -->
    <form id="loginForm">
      <div class="field"><label>Numéro de téléphone</label><input type="tel" id="loginPhone" placeholder="+229 00 00 00 00" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="loginPass" placeholder="••••••••" required></div>
      <button class="btn-main" type="submit" id="loginBtn">Se connecter</button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" style="display:none;">
      <div class="photo-pick">
        <div class="photo-circle" id="photoCircle">📷</div>
        <div class="upload-label">Photo de profil<br><b id="pickPhotoBtn">Choisir une image</b></div>
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
      </div>
      <div class="field"><label>Nom complet</label><input type="text" id="regName" placeholder="Ton vrai nom (privé)" required></div>
      <div class="field"><label>Numéro de téléphone</label><input type="tel" id="regPhone" placeholder="+229 00 00 00 00" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="regPass" placeholder="8 caractères minimum" required minlength="6"></div>

      <div class="codename-reveal" id="codenameReveal">
        <div class="lbl">Ton identifiant KRYPT généré</div>
        <div class="cn" id="codenameValue"></div>
      </div>

      <button class="btn-main" type="submit" id="registerBtn">Créer mon identité</button>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="app" id="appShell">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="avatar" id="myAvatar"></div>
        <div class="who">
          <div class="cn" id="myCodeName"></div>
          <div class="st">En ligne</div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Déconnexion">⎋</button>
      </div>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Rechercher un identifiant KRYPT…" autocomplete="off">
      </div>
      <div class="search-results" id="searchResults" style="display:none;"></div>
      <div class="chat-list" id="chatList">
        <div class="empty-list">Aucune conversation. Cherche un identifiant KRYPT pour démarrer.</div>
      </div>
    </div>

    <div class="main" id="mainPanel">
      <div class="no-chat" id="noChat">
        <div class="glyph">◈</div>
        <div>Sélectionne une conversation ou lance une recherche</div>
      </div>

      <div id="chatView" style="display:none;flex-direction:column;height:100%;">
        <div class="chat-head">
          <button class="back-btn" id="backBtn">←</button>
          <div class="avatar" id="peerAvatar"></div>
          <div style="flex:1;">
            <div class="cn" id="peerCodeName"></div>
            <div class="st" id="peerStatus">—</div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="upload-progress" id="uploadProgress"></div>
        <div class="composer">
          <button class="attach-btn" id="attachBtn">📎</button>
          <input type="file" id="fileInput" accept="image/*,video/*">
          <textarea id="msgInput" rows="1" placeholder="Écris un message…"></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
/* ======================================================================
   CONFIG
====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDHRxGdHpM2RFtvGMhXOu3slrT2JlmyNLM",
  authDomain: "data-fae4a.firebaseapp.com",
  databaseURL: "https://data-fae4a-default-rtdb.firebaseio.com",
  projectId: "data-fae4a",
  storageBucket: "data-fae4a.firebasestorage.app",
  messagingSenderId: "1077301559347",
  appId: "1:1077301559347:web:3405ab3bc8e1010d9e6346"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- CLOUDINARY : remplace UPLOAD_PRESET par un "unsigned upload preset"
// créé dans Cloudinary > Settings > Upload > Upload presets (Signing Mode: Unsigned)
const CLOUDINARY_CLOUD_NAME = "tdlhsxsp";
const CLOUDINARY_UPLOAD_PRESET = "krypt_unsigned"; // ⚠️ à créer dans ton dashboard Cloudinary

/* ======================================================================
   STATE (en mémoire uniquement — jamais de localStorage)
====================================================================== */
let currentUser = null;   // {uid, phone, fullName, codeName, photoURL}
let activeChatId = null;
let activePeer = null;
let messagesRef = null;
let messagesHandler = null;
let typingTimeout = null;

/* ======================================================================
   UTILS
====================================================================== */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function cleanPhone(p){ return p.replace(/[^0-9+]/g,''); }
function uidFromPhone(p){ return 'u_' + cleanPhone(p).replace('+',''); }
function initials(name){ return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function showError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg; el.style.display='block';
  setTimeout(()=>el.style.display='none', 4500);
}
function chatIdFor(a,b){ return [a,b].sort().join('__'); }

/* ---------- Générateur de code name "dingue" ---------- */
const ADJ = ["Furtif","Cyclone","Neon","Cobra","Xeno","Vortex","Kaido","Fantome","Turbo","Nova","Cryptik","Zeta","Sombra","Onyx","Volt","Rebel","Kraken","Glitch","Umbra","Falcon"];
const NOUN = ["Wolf","Byte","Shadow","Blaze","Reaper","Comet","Drift","Phase","Static","Rogue","Pulse","Venom","Ghost","Nomad","Frost","Havoc","Rune","Echo","Storm","Fang"];
function randInt(n){ return Math.floor(Math.random()*n); }
function generateCodeCandidate(){
  const a = ADJ[randInt(ADJ.length)];
  const n = NOUN[randInt(NOUN.length)];
  const num = 10 + randInt(90);
  return `${a}${n}${num}`;
}
async function generateUniqueCodeName(){
  for(let i=0;i<25;i++){
    const candidate = generateCodeCandidate();
    const snap = await db.ref('codeNames/'+candidate).get();
    if(!snap.exists()) return candidate;
  }
  return generateCodeCandidate() + Date.now().toString().slice(-4);
}

/* ---------- Cloudinary upload ---------- */
async function uploadToCloudinary(file, onProgress){
  return new Promise((resolve,reject)=>{
    const isVideo = file.type.startsWith('video');
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${isVideo?'video':'image'}/upload`;
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = (e)=>{ if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload = ()=>{
      if(xhr.status>=200 && xhr.status<300){
        const data = JSON.parse(xhr.responseText);
        resolve({url:data.secure_url, type:isVideo?'video':'image'});
      } else reject(new Error('Échec upload Cloudinary ('+xhr.status+')'));
    };
    xhr.onerror = ()=>reject(new Error('Erreur réseau upload'));
    xhr.send(form);
  });
}

/* ======================================================================
   AUTH TABS
====================================================================== */
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
tabLogin.onclick = ()=>{ tabLogin.classList.add('active'); tabRegister.classList.remove('active'); loginForm.style.display='block'; registerForm.style.display='none'; };
tabRegister.onclick = ()=>{ tabRegister.classList.add('active'); tabLogin.classList.remove('active'); registerForm.style.display='block'; loginForm.style.display='none'; };

/* ---------- Photo picker (registration) ---------- */
let pendingPhotoFile = null;
document.getElementById('photoCircle').onclick = ()=>document.getElementById('photoInput').click();
document.getElementById('pickPhotoBtn').onclick = ()=>document.getElementById('photoInput').click();
document.getElementById('photoInput').onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingPhotoFile = file;
  const reader = new FileReader();
  reader.onload = ()=>{ document.getElementById('photoCircle').innerHTML = `<img src="${reader.result}">`; };
  reader.readAsDataURL(file);
};

/* ---------- REGISTER ---------- */
document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const name = document.getElementById('regName').value.trim();
  const phone = cleanPhone(document.getElementById('regPhone').value.trim());
  const pass = document.getElementById('regPass').value;
  if(!name || !phone || pass.length<6){ showError("Remplis tous les champs (mot de passe ≥ 6 caractères)."); return; }

  btn.disabled = true; btn.textContent = "Création…";
  try{
    const uid = uidFromPhone(phone);
    const existing = await db.ref('users/'+uid).get();
    if(existing.exists()){ showError("Un compte existe déjà avec ce numéro."); btn.disabled=false; btn.textContent="Créer mon identité"; return; }

    let photoURL = "";
    if(pendingPhotoFile){
      try{
        const up = await uploadToCloudinary(pendingPhotoFile);
        photoURL = up.url;
      }catch(err){ console.warn("Upload photo échoué:", err.message); }
    }

    const codeName = await generateUniqueCodeName();
    const passHash = await sha256(pass + '::krypt::' + phone);

    await db.ref('users/'+uid).set({
      uid, phone, fullName:name, codeName, photoURL,
      passHash, createdAt: firebase.database.ServerValue.TIMESTAMP
    });
    await db.ref('codeNames/'+codeName).set(uid);
    await db.ref('directory/'+uid).set({codeName, photoURL});

    document.getElementById('codenameReveal').style.display='block';
    document.getElementById('codenameValue').textContent = codeName;
    btn.textContent = "Entrer dans KRYPT →";
    btn.disabled = false;
    btn.onclick = null;
    btn.type='button';
    btn.onclick = ()=>{
      currentUser = {uid, phone, fullName:name, codeName, photoURL};
      enterApp();
    };
  }catch(err){
    console.error(err);
    showError("Erreur : " + err.message);
    btn.disabled = false; btn.textContent = "Créer mon identité";
  }
});

/* ---------- LOGIN ---------- */
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const phone = cleanPhone(document.getElementById('loginPhone').value.trim());
  const pass = document.getElementById('loginPass').value;
  btn.disabled = true; btn.textContent = "Connexion…";
  try{
    const uid = uidFromPhone(phone);
    const snap = await db.ref('users/'+uid).get();
    if(!snap.exists()){ showError("Aucun compte pour ce numéro."); btn.disabled=false; btn.textContent="Se connecter"; return; }
    const user = snap.val();
    const passHash = await sha256(pass + '::krypt::' + phone);
    if(passHash !== user.passHash){ showError("Mot de passe incorrect."); btn.disabled=false; btn.textContent="Se connecter"; return; }
    currentUser = user;
    enterApp();
  }catch(err){
    showError("Erreur : " + err.message);
    btn.disabled=false; btn.textContent="Se connecter";
  }
});

/* ======================================================================
   ENTER APP
====================================================================== */
function enterApp(){
  document.getElementById('authWrap').style.display='none';
  document.getElementById('appShell').style.display='block';

  document.getElementById('myCodeName').textContent = currentUser.codeName;
  const myAv = document.getElementById('myAvatar');
  if(currentUser.photoURL) myAv.innerHTML = `<img src="${currentUser.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  else myAv.textContent = initials(currentUser.fullName);

  // Presence
  const presenceRef = db.ref('presence/'+currentUser.uid);
  presenceRef.set({state:'online', lastSeen: firebase.database.ServerValue.TIMESTAMP});
  presenceRef.onDisconnect().set({state:'offline', lastSeen: firebase.database.ServerValue.TIMESTAMP});

  listenChatList();
}

/* ======================================================================
   SEARCH
====================================================================== */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchTimer = null;
searchInput.addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if(!q){ searchResults.style.display='none'; searchResults.innerHTML=''; return; }
  searchTimer = setTimeout(()=>runSearch(q), 250);
});
async function runSearch(q){
  const snap = await db.ref('directory').get();
  if(!snap.exists()){ searchResults.innerHTML = '<div class="empty-list">Aucun résultat.</div>'; searchResults.style.display='block'; return; }
  const all = snap.val();
  const matches = Object.entries(all).filter(([uid,d])=> d.codeName && d.codeName.toLowerCase().includes(q.toLowerCase()) && uid !== currentUser.uid).slice(0,15);
  if(matches.length===0){ searchResults.innerHTML = '<div class="empty-list">Aucun identifiant trouvé.</div>'; searchResults.style.display='block'; return; }
  searchResults.innerHTML = matches.map(([uid,d])=>`
    <div class="result-row" data-uid="${uid}" data-cn="${d.codeName}">
      <div class="avatar">${d.photoURL?`<img src="${d.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:initials(d.codeName)}</div>
      <div class="cn">${d.codeName}</div>
      <div class="add">Discuter</div>
    </div>`).join('');
  searchResults.style.display='block';
  searchResults.querySelectorAll('.result-row').forEach(row=>{
    row.onclick = ()=>{
      const uid = row.dataset.uid, cn = row.dataset.cn;
      searchInput.value=''; searchResults.style.display='none'; searchResults.innerHTML='';
      openChat(uid, cn, all[uid].photoURL);
    };
  });
}

/* ======================================================================
   CHAT LIST
====================================================================== */
function listenChatList(){
  db.ref('userChats/'+currentUser.uid).on('value', async (snap)=>{
    const listEl = document.getElementById('chatList');
    if(!snap.exists()){ listEl.innerHTML = '<div class="empty-list">Aucune conversation. Cherche un identifiant KRYPT pour démarrer.</div>'; return; }
    const chats = snap.val();
    const entries = Object.entries(chats).sort((a,b)=> (b[1].lastTimestamp||0)-(a[1].lastTimestamp||0));
    let html = '';
    for(const [otherUid, meta] of entries){
      const dirSnap = await db.ref('directory/'+otherUid).get();
      const dir = dirSnap.val() || {codeName:'???'};
      const presenceSnap = await db.ref('presence/'+otherUid).get();
      const online = presenceSnap.exists() && presenceSnap.val().state==='online';
      html += `<div class="chat-row" data-uid="${otherUid}" data-cn="${dir.codeName}" data-photo="${dir.photoURL||''}">
        <div class="avatar">${dir.photoURL?`<img src="${dir.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:initials(dir.codeName)}</div>
        ${online?'<div class="dot-online"></div>':''}
        <div class="info">
          <div class="top"><span class="cn">${dir.codeName}</span><span class="time">${meta.lastTimestamp?new Date(meta.lastTimestamp).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</span></div>
          <div class="preview">${meta.lastMessage||''}</div>
        </div>
      </div>`;
    }
    listEl.innerHTML = html;
    listEl.querySelectorAll('.chat-row').forEach(row=>{
      row.onclick = ()=>openChat(row.dataset.uid, row.dataset.cn, row.dataset.photo);
    });
  });
}

/* ======================================================================
   OPEN / RENDER CHAT
====================================================================== */
async function openChat(peerUid, peerCodeName, peerPhoto){
  activePeer = {uid:peerUid, codeName:peerCodeName, photoURL:peerPhoto};
  activeChatId = chatIdFor(currentUser.uid, peerUid);

  document.getElementById('noChat').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('peerCodeName').textContent = peerCodeName;
  const pAv = document.getElementById('peerAvatar');
  pAv.innerHTML = peerPhoto ? `<img src="${peerPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials(peerCodeName);

  db.ref('presence/'+peerUid).on('value', s=>{
    const st = document.getElementById('peerStatus');
    if(s.exists() && s.val().state==='online') st.textContent = 'En ligne';
    else if(s.exists()) st.textContent = 'Vu récemment';
    else st.textContent = '—';
  });

  db.ref('userChats/'+currentUser.uid+'/'+peerUid).update({
    otherUid: peerUid, lastMessage: (await db.ref('userChats/'+currentUser.uid+'/'+peerUid+'/lastMessage').get()).val() || '',
    lastTimestamp: (await db.ref('userChats/'+currentUser.uid+'/'+peerUid+'/lastTimestamp').get()).val() || firebase.database.ServerValue.TIMESTAMP
  });

  // ensure directory entries exist for both sides (search convenience)
  db.ref('userChats/'+peerUid+'/'+currentUser.uid).update({
    otherUid: currentUser.uid
  });

  if(messagesRef && messagesHandler) messagesRef.off('value', messagesHandler);
  messagesRef = db.ref('chats/'+activeChatId+'/messages');
  messagesHandler = messagesRef.on('value', (snap)=>{
    renderMessages(snap.val() || {});
  });

  // mobile view
  if(window.innerWidth <= 760){
    document.getElementById('sidebar').classList.add('hide');
    document.getElementById('mainPanel').classList.remove('hide');
  }
}
document.getElementById('backBtn').onclick = ()=>{
  document.getElementById('sidebar').classList.remove('hide');
  document.getElementById('mainPanel').classList.add('hide');
};

function renderMessages(msgs){
  const el = document.getElementById('messages');
  const entries = Object.entries(msgs).sort((a,b)=>a[1].timestamp-b[1].timestamp);
  el.innerHTML = entries.map(([id,m])=>{
    const mine = m.senderId === currentUser.uid;
    let body = '';
    if(m.type==='image') body = `<img src="${m.mediaURL}">`;
    else if(m.type==='video') body = `<video src="${m.mediaURL}" controls></video>`;
    if(m.text) body += `<div>${escapeHtml(m.text)}</div>`;
    const ticks = mine ? (m.status==='read' ? '✓✓' : m.status==='delivered' ? '✓✓' : '✓') : '';
    return `<div class="msg-row ${mine?'me':'them'}"><div class="bubble">${body}<div class="meta">${new Date(m.timestamp).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} ${ticks}</div></div></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;

  // mark incoming as read
  entries.forEach(([id,m])=>{
    if(m.senderId !== currentUser.uid && m.status !== 'read'){
      db.ref('chats/'+activeChatId+'/messages/'+id+'/status').set('read');
    }
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ======================================================================
   SEND MESSAGE
====================================================================== */
async function sendMessage({text, mediaURL, type}){
  if(!activeChatId) return;
  const msg = {
    senderId: currentUser.uid,
    text: text || '',
    type: type || 'text',
    mediaURL: mediaURL || null,
    timestamp: firebase.database.ServerValue.TIMESTAMP,
    status: 'sent'
  };
  const newRef = db.ref('chats/'+activeChatId+'/messages').push();
  await newRef.set(msg);

  const preview = type==='text' ? text : (type==='image' ? '📷 Photo' : '🎥 Vidéo');
  const ts = Date.now();
  db.ref('userChats/'+currentUser.uid+'/'+activePeer.uid).update({lastMessage:preview, lastTimestamp:ts, otherUid:activePeer.uid});
  db.ref('userChats/'+activePeer.uid+'/'+currentUser.uid).update({lastMessage:preview, lastTimestamp:ts, otherUid:currentUser.uid});
}

document.getElementById('sendBtn').onclick = doSendText;
document.getElementById('msgInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSendText(); }
});
function doSendText(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  sendMessage({text, type:'text'});
}

document.getElementById('attachBtn').onclick = ()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const progEl = document.getElementById('uploadProgress');
  progEl.style.display='block';
  progEl.textContent = 'Envoi… 0%';
  try{
    const up = await uploadToCloudinary(file, (pct)=>{ progEl.textContent = 'Envoi… '+pct+'%'; });
    await sendMessage({type: up.type, mediaURL: up.url});
  }catch(err){
    alert("Échec de l'envoi : " + err.message + "\n\n(Vérifie que le preset Cloudinary 'krypt_unsigned' existe et est en mode Unsigned)");
  }finally{
    progEl.style.display='none';
    e.target.value='';
  }
});

/* ======================================================================
   LOGOUT
====================================================================== */
document.getElementById('logoutBtn').onclick = ()=>{
  if(currentUser){
    db.ref('presence/'+currentUser.uid).set({state:'offline', lastSeen: firebase.database.ServerValue.TIMESTAMP});
  }
  if(messagesRef && messagesHandler) messagesRef.off('value', messagesHandler);
  currentUser = null; activeChatId = null; activePeer = null;
  document.getElementById('appShell').style.display='none';
  document.getElementById('authWrap').style.display='flex';
  document.getElementById('loginForm').reset();
  document.getElementById('registerForm').reset();
  document.getElementById('codenameReveal').style.display='none';
  const btn = document.getElementById('registerBtn');
  btn.type='submit'; btn.onclick=null; btn.textContent='Créer mon identité';
};

/* ======================================================================
   BOOT
====================================================================== */
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('loader').style.display='none';
    document.getElementById('authWrap').style.display='flex';
  }, 700);
});
</script>
